name: Update football matches

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

jobs:
  update-matches:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Recuperer le depot
        uses: actions/checkout@v4


      - name: Recuperer les matchs des 7 prochains jours
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |

          set -e

          export TZ="Africa/Douala"

          mkdir -p data

          echo "====================================="
          echo "RECUPERATION DES MATCHS"
          echo "====================================="


          for i in 0 1 2 3 4 5 6
          do

            DATE=$(date -d "+${i} days" +"%Y-%m-%d")

            echo ""
            echo "-------------------------------------"
            echo "Date : ${DATE}"
            echo "-------------------------------------"


            curl --fail --silent --show-error \
              --request GET \
              --url "https://v3.football.api-sports.io/fixtures?date=${DATE}&timezone=Africa%2FDouala" \
              --header "x-apisports-key: ${API_KEY}" \
              --header "Accept: application/json" \
              > "data/${DATE}.json"


            echo "Verification du JSON..."


            if ! jq empty "data/${DATE}.json"; then

              echo "ERREUR : JSON invalide pour ${DATE}"

              cat "data/${DATE}.json"

              exit 1

            fi


            API_ERRORS=$(jq '(.errors // {}) | length' "data/${DATE}.json")


            if [ "$API_ERRORS" -gt 0 ]; then

              echo "ERREUR API-Football pour ${DATE} :"

              jq '.errors' "data/${DATE}.json"

              exit 1

            fi


            MATCH_COUNT=$(jq '.response | length' "data/${DATE}.json")


            echo "Matchs recuperes : ${MATCH_COUNT}"


          done


          TODAY=$(date +"%Y-%m-%d")

          TOMORROW=$(date -d "+1 day" +"%Y-%m-%d")


          echo ""
          echo "Creation de today.json..."

          cp \
            "data/${TODAY}.json" \
            "data/today.json"


          echo "Creation de tomorrow.json..."

          cp \
            "data/${TOMORROW}.json" \
            "data/tomorrow.json"


          echo ""
          echo "====================================="
          echo "RECUPERATION TERMINEE"
          echo "====================================="


          echo ""

          ls -lh data/


      - name: Enregistrer les donnees
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/


          if git diff --cached --quiet; then

            echo "Aucune modification."

          else

            git commit -m "Update football matches"

            git push

          fi
