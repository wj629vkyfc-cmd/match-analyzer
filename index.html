<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Match Analyzer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0f14;
      color: #ffffff;
      min-height: 100vh;
      padding: 18px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    /* HEADER */

    .header {
      margin-bottom: 22px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    h1 {
      font-size: 30px;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 14px;
    }

    .refresh-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #121821;
      border: 1px solid #29313d;
      color: white;
      font-size: 18px;
    }

    .refresh-btn:hover {
      background: #1a2330;
    }

    /* SEARCH */

    .search-box {
      margin-bottom: 18px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      background: #121821;
      color: white;
      border: 1px solid #29313d;
      border-radius: 12px;
      outline: none;
    }

    .search-input:focus {
      border-color: #2563eb;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
    }

    /* DATE TABS */

    .date-tabs-wrapper {
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 3px;
    }

    .date-tabs {
      display: flex;
      gap: 8px;
      min-width: max-content;
    }

    .date-tab {
      min-width: 92px;
      padding: 11px 12px;
      border-radius: 12px;
      background: #121821;
      border: 1px solid #29313d;
      color: #d1d5db;
      text-align: center;
    }

    .date-tab:hover {
      background: #1a2330;
    }

    .date-tab.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }

    .date-tab-day {
      display: block;
      font-size: 12px;
      margin-bottom: 3px;
      opacity: 0.8;
    }

    .date-tab-date {
      display: block;
      font-size: 14px;
      font-weight: bold;
    }

    /* STATUS */

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      color: #9ca3af;
      font-size: 13px;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
    }

    /* MATCH */

    .match {
      background: #121821;
      border: 1px solid #29313d;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .league {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #9ca3af;
      font-size: 12px;
      min-width: 0;
    }

    .league img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .league-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .match-status {
      font-size: 11px;
      font-weight: bold;
      padding: 5px 8px;
      border-radius: 7px;
      white-space: nowrap;
    }

    .status-upcoming {
      background: #1e293b;
      color: #cbd5e1;
    }

    .status-live {
      background: #17351f;
      color: #4ade80;
    }

    .status-finished {
      background: #1f2937;
      color: #9ca3af;
    }

    .status-postponed {
      background: #3a2914;
      color: #fbbf24;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 70px 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: bold;
      min-width: 0;
    }

    .team.home {
      justify-content: flex-end;
      text-align: right;
    }

    .team.away {
      justify-content: flex-start;
      text-align: left;
    }

    .team img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .team-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .match-center {
      text-align: center;
    }

    .match-time {
      font-size: 17px;
      font-weight: bold;
    }

    .vs {
      color: #6b7280;
      font-size: 11px;
      margin-top: 3px;
    }

    .score {
      font-size: 19px;
      font-weight: bold;
    }

    .analyze-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    .analyze-btn:hover {
      background: #1d4ed8;
    }

    /* ANALYSIS */

    .analysis {
      display: none;
      margin-top: 14px;
    }

    .confidence {
      background: #13261b;
      border: 1px solid #285c3a;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
    }

    .confidence-label {
      color: #9ca3af;
      font-size: 12px;
    }

    .confidence-number {
      font-size: 30px;
      font-weight: bold;
      margin-top: 5px;
    }

    .market {
      background: #0e141c;
      border: 1px solid #29313d;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 8px;
    }

    .market-title {
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .market-value {
      font-size: 17px;
      font-weight: bold;
    }

    .reason {
      background: #0e141c;
      border-radius: 12px;
      padding: 14px;
      color: #d1d5db;
      line-height: 1.5;
      font-size: 13px;
    }

    /* LOADING */

    .loading {
      text-align: center;
      padding: 45px 20px;
      color: #9ca3af;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #29313d;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* EMPTY / ERROR */

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 40px 15px;
      background: #121821;
      border: 1px solid #29313d;
      border-radius: 16px;
    }

    .error {
      color: #fca5a5;
    }

    /* MOBILE */

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      h1 {
        font-size: 26px;
      }

      .teams {
        grid-template-columns: 1fr 58px 1fr;
      }

      .team {
        font-size: 13px;
      }

      .team img {
        width: 26px;
        height: 26px;
      }

      .match-time {
        font-size: 15px;
      }

    }
  </style>
</head>


<body>

  <div class="container">

    <!-- HEADER -->

    <header class="header">

      <div class="header-top">

        <div>

          <h1>⚽ Match Analyzer</h1>

          <p class="subtitle">
            Les matchs des 7 prochains jours
          </p>

        </div>

        <button
          id="refreshBtn"
          class="refresh-btn"
          title="Actualiser"
        >
          ↻
        </button>

      </div>

    </header>


    <!-- SEARCH -->

    <div class="search-box">

      <span class="search-icon">
        🔎
      </span>

      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Rechercher une équipe ou une ligue..."
        autocomplete="off"
      >

    </div>


    <!-- DATES -->

    <div class="date-tabs-wrapper">

      <div
        id="dateTabs"
        class="date-tabs"
      ></div>

    </div>


    <!-- STATUS -->

    <div class="status-bar">

      <span id="matchCount">
        Chargement...
      </span>

      <span class="live-indicator">

        <span class="live-dot"></span>

        Données API

      </span>

    </div>


    <!-- MATCHES -->

    <main id="matches">

      <div class="loading">

        <div class="spinner"></div>

        Chargement des matchs...

      </div>

    </main>

  </div>


  <script>

    /*
      ==========================================
      CONFIGURATION
      ==========================================
    */

    /*
      IMPORTANT :

      Le navigateur appelle notre endpoint local :

        /api/fixtures

      Le backend devra ensuite appeler API-Football
      avec la clé secrète.

      On ne met PAS la clé API dans ce fichier.
    */

    const API_ENDPOINT = "/api/fixtures";


    /*
      Fuseau horaire du navigateur.
    */

    const USER_TIMEZONE =
      Intl.DateTimeFormat().resolvedOptions().timeZone;


    /*
      ==========================================
      VARIABLES
      ==========================================
    */

    let allMatches = [];

    let selectedDate = "";

    let searchTerm = "";


    /*
      ==========================================
      ÉLÉMENTS HTML
      ==========================================
    */

    const dateTabs =
      document.getElementById("dateTabs");

    const matchesContainer =
      document.getElementById("matches");

    const searchInput =
      document.getElementById("searchInput");

    const refreshBtn =
      document.getElementById("refreshBtn");

    const matchCount =
      document.getElementById("matchCount");


    /*
      ==========================================
      OUTILS DATE
      ==========================================
    */

    function pad(number) {

      return String(number).padStart(2, "0");

    }


    function dateToString(date) {

      return (
        date.getFullYear() +
        "-" +
        pad(date.getMonth() + 1) +
        "-" +
        pad(date.getDate())
      );

    }


    function getNextSevenDays() {

      const days = [];

      const today = new Date();

      for (let i = 0; i < 7; i++) {

        const date = new Date(today);

        date.setDate(
          today.getDate() + i
        );

        days.push({
          value: dateToString(date),
          date: date
        });

      }

      return days;

    }


    /*
      ==========================================
      FORMATAGE DATE
      ==========================================
    */

    function formatDayName(date, index) {

      if (index === 0) {
        return "Aujourd'hui";
      }

      if (index === 1) {
        return "Demain";
      }

      return date.toLocaleDateString(
        "fr-FR",
        {
          weekday: "short"
        }
      );

    }


    function formatShortDate(date) {

      return date.toLocaleDateString(
        "fr-FR",
        {
          day: "2-digit",
          month: "2-digit"
        }
      );

    }


    /*
      ==========================================
      CRÉER LES 7 JOURS
      ==========================================
    */

    function createDateTabs() {

      dateTabs.innerHTML = "";

      const days =
        getNextSevenDays();


      days.forEach((day, index) => {

        const button =
          document.createElement("button");

        button.className =
          "date-tab";


        if (
          day.value === selectedDate
        ) {

          button.classList.add("active");

        }


        button.innerHTML = `

          <span class="date-tab-day">
            ${formatDayName(day.date, index)}
          </span>

          <span class="date-tab-date">
            ${formatShortDate(day.date)}
          </span>

        `;


        button.addEventListener(
          "click",
          () => {

            selectedDate =
              day.value;

            createDateTabs();

            renderMatches();

          }
        );


        dateTabs.appendChild(button);

      });

    }


    /*
      ==========================================
      CHARGER API
      ==========================================
    */

    async function loadMatches() {

      showLoading();


      try {

        const days =
          getNextSevenDays();


        const from =
          days[0].value;


        const to =
          days[6].value;


        /*
          Le backend reçoit :

          from
          to
          timezone

          puis appelle API-Football.
        */

        const url =
          `${API_ENDPOINT}?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&timezone=${encodeURIComponent(USER_TIMEZONE)}`;


        const response =
          await fetch(url, {
            method: "GET",
            headers: {
              "Accept": "application/json"
            }
          });


        if (!response.ok) {

          throw new Error(
            `Erreur serveur (${response.status})`
          );

        }


        const data =
          await response.json();


        /*
          API-Football renvoie normalement :

          {
            response: [...]
          }

          Notre backend peut aussi renvoyer
          directement un tableau.
        */

        if (Array.isArray(data)) {

          allMatches =
            convertMatches(data);

        } else {

          allMatches =
            convertMatches(
              data.response || []
            );

        }


        /*
          Trier les matchs par date/heure.
        */

        allMatches.sort(
          (a, b) =>
            new Date(a.date) -
            new Date(b.date)
        );


        /*
          Si aucune date n'est sélectionnée,
          sélectionner aujourd'hui.
        */

        if (!selectedDate) {

          selectedDate =
            days[0].value;

        }


        createDateTabs();

        renderMatches();

        startLiveRefresh();


      } catch (error) {

        console.error(
          "Erreur API :",
          error
        );


        showError(error.message);

      }

    }


    /*
      ==========================================
      CONVERSION API-FOOTBALL
      ==========================================
    */

    function convertMatches(apiMatches) {

      if (!Array.isArray(apiMatches)) {

        return [];

      }


      return apiMatches.map(
        (item) => {

          const fixture =
            item.fixture || {};

          const league =
            item.league || {};

          const teams =
            item.teams || {};

          const home =
            teams.home || {};

          const away =
            teams.away || {};

          const goals =
            item.goals || {};

          const status =
            fixture.status || {};


          return {

            id:
              fixture.id || null,

            date:
              fixture.date || "",

            timestamp:
              fixture.timestamp || null,

            league:
              league.name ||
              "Ligue inconnue",

            leagueLogo:
              league.logo || "",

            country:
              league.country || "",

            home:
              home.name ||
              "Équipe inconnue",

            homeLogo:
              home.logo || "",

            away:
              away.name ||
              "Équipe inconnue",

            awayLogo:
              away.logo || "",

            homeScore:
              goals.home,

            awayScore:
              goals.away,

            status:
              status.short || "NS",

            statusLong:
              status.long || "Programmé",

            elapsed:
              status.elapsed || null

          };

        }
      );

    }


    /*
      ==========================================
      OBTENIR LA DATE LOCALE DU MATCH
      ==========================================
    */

    function getMatchDate(match) {

      if (!match.date) {
        return "";
      }


      const date =
        new Date(match.date);


      return dateToString(date);

    }


    /*
      ==========================================
      FORMATAGE DE L'HEURE
      ==========================================
    */

    function formatMatchTime(match) {

      if (!match.date) {
        return "--:--";
      }


      return new Date(
        match.date
      ).toLocaleTimeString(
        "fr-FR",
        {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone: USER_TIMEZONE
        }
      );

    }


    /*
      ==========================================
      STATUT DU MATCH
      ==========================================
    */

    function getStatusInfo(match) {

      const status =
        match.status;


      const liveStatuses = [
        "1H",
        "2H",
        "HT",
        "ET",
        "BT",
        "P"
      ];


      const finishedStatuses = [
        "FT",
        "AET",
        "PEN"
      ];


      const postponedStatuses = [
        "PST",
        "CANC",
        "SUSP",
        "INT"
      ];


      if (
        liveStatuses.includes(status)
      ) {

        return {

          className:
            "status-live",

          text:
            match.elapsed
              ? `LIVE ${match.elapsed}'`
              : "LIVE"

        };

      }


      if (
        finishedStatuses.includes(status)
      ) {

        return {

          className:
            "status-finished",

          text:
            "Terminé"

        };

      }


      if (
        postponedStatuses.includes(status)
      ) {

        return {

          className:
            "status-postponed",

          text:
            match.statusLong ||
            "Reporté"

        };

      }


      return {

        className:
          "status-upcoming",

        text:
          "À venir"

      };

    }


    /*
      ==========================================
      FILTRER LES MATCHS
      ==========================================
    */

    function getFilteredMatches() {

      return allMatches.filter(
        match => {

          /*
            Filtre par date
          */

          const matchDate =
            getMatchDate(match);


          if (
            matchDate !== selectedDate
          ) {

            return false;

          }


          /*
            Filtre recherche
          */

          if (!searchTerm) {

            return true;

          }


          const search =
            searchTerm.toLowerCase();


          return (

            match.home
              .toLowerCase()
              .includes(search)

            ||

            match.away
              .toLowerCase()
              .includes(search)

            ||

            match.league
              .toLowerCase()
              .includes(search)

            ||

            match.country
              .toLowerCase()
              .includes(search)

          );

        }
      );

    }


    /*
      ==========================================
      AFFICHER LES MATCHS
      ==========================================
    */

    function renderMatches() {

      const filtered =
        getFilteredMatches();


      matchesContainer.innerHTML = "";


      matchCount.textContent =
        `${filtered.length} match${filtered.length > 1 ? "s" : ""}`;


      if (
        filtered.length === 0
      ) {

        matchesContainer.innerHTML = `

          <div class="empty">

            ⚽

            <br><br>

            Aucun match trouvé.

            <br><br>

            Essaie une autre équipe,
            une autre ligue ou une autre date.

          </div>

        `;

        return;

      }


      filtered.forEach(
        (match) => {

          matchesContainer.appendChild(
            createMatchCard(match)
          );

        }
      );

    }


    /*
      ==========================================
      CARTE MATCH
      ==========================================
    */

    function createMatchCard(match) {

      const card =
        document.createElement("article");


      card.className =
        "match";


      const statusInfo =
        getStatusInfo(match);


      const isFinished =
        [
          "FT",
          "AET",
          "PEN"
        ].includes(match.status);


      const hasScore =
        match.homeScore !== null &&
        match.homeScore !== undefined &&
        match.awayScore !== null &&
        match.awayScore !== undefined;


      let centerContent;


      if (
        isFinished ||
        hasScore
      ) {

        centerContent = `

          <div class="score">

            ${match.homeScore ?? "-"}
            -
            ${match.awayScore ?? "-"}

          </div>

          <div class="vs">
            ${statusInfo.text}
          </div>

        `;

      } else {

        centerContent = `

          <div class="match-time">
            ${formatMatchTime(match)}
          </div>

          <div class="vs">
            VS
          </div>

        `;

      }


      card.innerHTML = `

        <div class="match-header">

          <div class="league">

            ${
              match.leagueLogo
                ? `<img
                    src="${escapeHtml(match.leagueLogo)}"
                    alt=""
                    loading="lazy"
                  >`
                : ""
            }

            <span class="league-name">
              ${escapeHtml(match.league)}
            </span>

          </div>


          <span
            class="match-status ${statusInfo.className}"
          >
            ${escapeHtml(statusInfo.text)}
          </span>

        </div>


        <div class="teams">

          <div class="team home">

            <span class="team-name">
              ${escapeHtml(match.home)}
            </span>

            ${
              match.homeLogo
                ? `<img
                    src="${escapeHtml(match.homeLogo)}"
                    alt=""
                    loading="lazy"
                  >`
                : ""
            }

          </div>


          <div class="match-center">

            ${centerContent}

          </div>


          <div class="team away">

            ${
              match.awayLogo
                ? `<img
                    src="${escapeHtml(match.awayLogo)}"
                    alt=""
                    loading="lazy"
                  >`
                : ""
            }

            <span class="team-name">
              ${escapeHtml(match.away)}
            </span>

          </div>

        </div>


        <button
          class="analyze-btn"
          data-fixture-id="${match.id}"
        >

          🔍 Analyser le match

        </button>


        <div
          class="analysis"
          id="analysis-${match.id}"
        ></div>

      `;


      const analyzeButton =
        card.querySelector(
          ".analyze-btn"
        );


      analyzeButton.addEventListener(
        "click",
        () => {

          analyzeMatch(match);

        }
      );


      return card;

    }


    /*
      ==========================================
      ANALYSE
      ==========================================
    */

    function analyzeMatch(match) {

      const analysis =
        document.getElementById(
          `analysis-${match.id}`
        );


      if (!analysis) {
        return;
      }


      /*
        MOTEUR PROVISOIRE

        Nous remplacerons ces valeurs
        par les vrais calculs statistiques.
      */

      const homeWin = 52;

      const draw = 26;

      const awayWin = 22;

      const doubleChance =
        homeWin + draw;

      const over15 = 78;

      const over25 = 57;

      const under35 = 72;

      const btts = 55;

      const confidence = 74;


      analysis.style.display =
        "block";


      analysis.innerHTML = `

        <div class="confidence">

          <div class="confidence-label">
            CONFIANCE DU MODÈLE
          </div>

          <div class="confidence-number">
            ${confidence}/100
          </div>

        </div>


        <div class="market">

          <div class="market-title">
            1X2
          </div>

          <div class="market-value">

            ${escapeHtml(match.home)}
            :
            ${homeWin}%

          </div>

          <div>

            Nul :
            ${draw}%

            &nbsp;|&nbsp;

            ${escapeHtml(match.away)}
            :
            ${awayWin}%

          </div>

        </div>


        <div class="market">

          <div class="market-title">
            DOUBLE CHANCE
          </div>

          <div class="market-value">
            1X : ${doubleChance}%
          </div>

        </div>


        <div class="market">

          <div class="market-title">
            OVER / UNDER
          </div>

          <div>
            Over 1.5 :
            <strong>${over15}%</strong>
          </div>

          <div>
            Over 2.5 :
            <strong>${over25}%</strong>
          </div>

          <div>
            Under 3.5 :
            <strong>${under35}%</strong>
          </div>

        </div>


        <div class="market">

          <div class="market-title">
            BTTS
          </div>

          <div class="market-value">
            Oui : ${btts}%
          </div>

        </div>


        <div class="reason">

          <strong>
            📊 Analyse du modèle
          </strong>

          <br><br>

          <strong>
            Match :
          </strong>

          ${escapeHtml(match.home)}
          vs
          ${escapeHtml(match.away)}

          <br><br>

          Les matchs sont maintenant récupérés
          automatiquement depuis la source API.

          <br><br>

          ⚠️ Les probabilités affichées ici sont
          encore provisoires. La prochaine étape
          consiste à connecter cette zone au moteur
          statistique réel.

        </div>

      `;

    }


    /*
      ==========================================
      ÉCHAPPEMENT HTML
      ==========================================
    */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      ==========================================
      LOADING
      ==========================================
    */

    function showLoading() {

      matchesContainer.innerHTML = `

        <div class="loading">

          <div class="spinner"></div>

          Chargement des matchs...

        </div>

      `;


      matchCount.textContent =
        "Chargement...";

    }


    /*
      ==========================================
      ERREUR
      ==========================================
    */

    function showError(message) {

      matchesContainer.innerHTML = `

        <div class="empty error">

          ❌ Impossible de charger les matchs.

          <br><br>

          ${escapeHtml(message)}

          <br><br>

          Vérifie la connexion au serveur API.

        </div>

      `;


      matchCount.textContent =
        "Erreur";

    }


    /*
      ==========================================
      RECHERCHE
      ==========================================
    */

    searchInput.addEventListener(
      "input",
      (event) => {

        searchTerm =
          event.target.value.trim();

        renderMatches();

      }
    );


    /*
      ==========================================
      ACTUALISATION MANUELLE
      ==========================================
    */

    refreshBtn.addEventListener(
      "click",
      () => {

        loadMatches();

      }
    );


    /*
      ==========================================
      ACTUALISATION LIVE
      ==========================================
    */

    let liveRefreshTimer = null;


    function startLiveRefresh() {

      if (liveRefreshTimer) {

        clearInterval(
          liveRefreshTimer
        );

      }


      /*
        Actualisation toutes les 60 secondes.

        Le backend pourra ensuite optimiser
        les appels API selon les statuts.
      */

      liveRefreshTimer =
        setInterval(
          () => {

            loadMatches();

          },
          60000
        );

    }


    /*
      ==========================================
      DÉMARRAGE
      ==========================================
    */

    selectedDate =
      getNextSevenDays()[0].value;


    createDateTabs();

    loadMatches();

  </script>

</body>
</html>
